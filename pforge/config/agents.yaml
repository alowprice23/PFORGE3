# This file defines the configuration for each agent in the pForge system.
# It is loaded by the Orchestrator to instantiate and configure agents.

agents:
  - name: observer
    enabled: true
    # How often the agent's main `on_tick` logic should run, in seconds.
    tick_interval: 5.0
    # A threshold (0.0 to 1.0) for how many other agents must be idle
    # before this agent is allowed to spawn.
    spawn_threshold: 0.8
    # A threshold (0.0 to 1.0) for how many other agents must be active
    # before this agent is forced to retire to free up resources.
    retire_threshold: 0.0
    # The maximum number of concurrent instances of this agent that can run.
    max_concurrency: 1
    startup_capabilities:
      - exec:test
      - exec:lint
      - fs:read

  - name: spec_oracle
    enabled: true
    tick_interval: 1.0
    spawn_threshold: 0.0
    retire_threshold: 0.0
    max_concurrency: 1

  - name: planner
    enabled: true
    tick_interval: 2.0
    spawn_threshold: 0.0
    retire_threshold: 0.0
    max_concurrency: 1

  - name: fixer
    enabled: true
    tick_interval: 1.0
    spawn_threshold: 0.0
    retire_threshold: 0.0
    max_concurrency: 3

  - name: predictor
    enabled: true
    tick_interval: 1.0
    spawn_threshold: 0.0
    retire_threshold: 0.0
    max_concurrency: 1

  - name: misfit
    enabled: true
    tick_interval: 2.0
    spawn_threshold: 0.5
    retire_threshold: 0.0
    max_concurrency: 1

  - name: false_piece
    enabled: true
    tick_interval: 5.0
    spawn_threshold: 0.7
    retire_threshold: 0.0
    max_concurrency: 1

  - name: backtracker
    enabled: true
    tick_interval: 1.0
    spawn_threshold: 0.0
    retire_threshold: 0.0
    max_concurrency: 1

  - name: summarizer
    enabled: true
    tick_interval: 1.0
    spawn_threshold: 0.0
    retire_threshold: 0.0
    max_concurrency: 1

  - name: formatter
    enabled: true
    tick_interval: 1.0
    spawn_threshold: 0.0
    retire_threshold: 0.0
    max_concurrency: 1

  - name: recovery
    enabled: true
    tick_interval: 60.0
    spawn_threshold: 0.3
    retire_threshold: 0.0
    max_concurrency: 1
    startup_capabilities:
      - system:load_dynamic_modules

  - name: self_repair
    enabled: true
    tick_interval: 300.0
    spawn_threshold: 0.3
    retire_threshold: 0.0
    max_concurrency: 1
    startup_capabilities:
      - system:load_dynamic_modules

  - name: conflict_detector
    enabled: true
    tick_interval: 1.0
    spawn_threshold: 0.0
    retire_threshold: 0.0
    max_concurrency: 1
