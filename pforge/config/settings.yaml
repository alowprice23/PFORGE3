service:
  name: pForge
  environment: "dev"
  log_level: "INFO"

ports:
  api: 8000
  ui: 3000
  grafana: 3000
  prometheus: 9090
  neo4j_http: 7474
  neo4j_bolt: 7687
  redis: 6379

feature_flags:
  enable_metrics: true
  enable_agent_economy: true
  enable_prompts_debug: false
  allow_shell_exec: true

mode: local # or docker

cadence: 1.0 # orchestrator tick interval in seconds

specifications:
  # Configuration for the SpecOracleAgent.
  # Each check can be enabled or disabled.
  # The `command` field should be a template with {file_path} as a placeholder.
  ruff:
    enabled: true
    command: "ruff check --select I --fix-safety=unsafe {file_path}"
  mypy:
    enabled: false # mypy can be slow, so disable by default
    command: "mypy --strict {file_path}"
  disallowed_imports:
    # A custom check for architectural rules.
    # The SpecOracleAgent will need specific logic to handle this.
    enabled: true
    rules:
      - from: "pforge.agents"
        disallow: "pforge.server"
      - from: "pforge.models"
        disallow: "pforge.agents"
