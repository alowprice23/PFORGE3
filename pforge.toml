# pForge Project Configuration

[doctor]
# The number of times the FixerAgent should retry a failed fix.
retry_limit = 2

[llm]
# The default LLM provider to use for generating fixes.
# provider = "openai"

# [llm.providers.openai]
# model = "gpt-4-turbo-preview"

# [llm.providers.anthropic]
# model = "claude-3-opus-20240229"

[recovery]
enabled = true
# A list of health checks to run periodically.
# Each check maps a detector function to a recovery action function.
checks = [
    { detector = "pforge.recovery.detectors.packages.check_pip_dependencies", action = "pforge.recovery.actions.pkg_resolve.install_packages" }
]
